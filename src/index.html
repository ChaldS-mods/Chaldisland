 sessions=[];const old=ls('chat',[]);
 if(old.length)sessions.push({id:'old',title:'',ts:Date.now(),msgs:old});
 sv('chat',[])}
const sessTitle=m=>{const u=m.find(x=>x.role==='user'),t=(u?String(u.content):'Новый чат').replace(/\s+/g,' ').trim();return t.length>44?t.slice(0,44)+'…':t};
if(sessions.length){sessions.sort((a,b)=>b.ts-a.ts);cur=sessions[0].id;chat=sessions[0].msgs}   // continue the latest conversation
function persistSess(){
 sessions.sort((a,b)=>b.ts-a.ts);if(sessions.length>40)sessions.splice(40);
 const pack=()=>sessions.map(s=>({id:s.id,title:s.title,ts:s.ts,msgs:s.msgs.slice(-60).map(m=>m.role==='tool'?{...m,content:String(m.content).slice(0,4000)}:m)}));
 for(;;){try{sv('sessions',pack());return}catch{if(sessions.length<=1)return;sessions.pop()}}}   // storage full: drop the oldest
function saveSess(){
 let s=sessions.find(x=>x.id===cur);
 if(!s){s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:'',ts:0,msgs:chat};sessions.unshift(s);cur=s.id}
 s.msgs=chat;if(!s.title)s.title=sessTitle(chat);s.ts=Date.now();persistSess()}
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';
 const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return 'сегодня '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 if(d.toDateString()===new Date(n-864e5).toDateString())return 'вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})};
function sessHtml(){
 const l=[...sessions].sort((a,b)=>b.ts-a.ts);
 return `<div id=ch style="height:196px;overflow:auto">${l.map(s=>`<div class="sess${s.id===cur?' cur':''}" data-act=sopen data-id="${s.id}"><div class=sb><div class=st>${esc(s.title||sessTitle(s.msgs))}</div><div class=sm>${ago(s.ts)} · ${s.msgs.filter(m=>m.role==='user').length} сообщ.${busy&&s.id===cur?' · отвечает…':''}</div></div><button class="sx${sdelAsk===s.id?' ask':''}" data-act=sdel data-id="${s.id}" title="Удалить">${sdelAsk===s.id?'Удалить?':ic('x',13)}</button></div>`).join('')||'<p class=mut>Чатов пока нет. Нажми «Новый чат».</p>'}</div>
  <div class=row><button class=b data-act=snew style="flex:1">${ic('pen',14)} Новый чат</button><button class=b data-act=csetup>${ic('gear',14)}</button></div>`}
// switching is blocked while the AI is answering: the answer is written into the open chat
const SA={
 snew:()=>{if(busy)return flash('Дождись ответа ИИ');chat=[];cur=null;chatView='chat';render()},
 sopen:d=>{const s=sessions.find(x=>x.id===d.id);if(!s)return;if(busy&&s.id!==cur)return flash('Дождись ответа ИИ');chat=s.msgs;cur=s.id;chatView='chat';render()},
 clist:()=>{chatView='list';render()},
 sdel:d=>{
  if(sdelAsk!==d.id){sdelAsk=d.id;render();setTimeout(()=>{if(sdelAsk===d.id){sdelAsk=null;if(open&&tab==='chat')render()}},3000);return}
  sdelAsk=null;
  if(busy&&d.id===cur)return flash('Дождись ответа ИИ');
  sessions=sessions.filter(x=>x.id!==d.id);
  if(d.id===cur){cur=null;chat=[]}
  persistSess();render()}};

// voice to text (Whisper-compatible endpoint) and screen recording
async function voice(fromKey){
 if(rec?.kind==='voice')return rec.mr.stop();
 if(!cfg.key||!cfg.stt){flash('Для голоса нужен ключ Groq (Whisper)');chatSet=true;setOpen(true,'chat');return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],mr=new MediaRecorder(st);
  mr.ondataavailable=e=>ch.push(e.data);
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());rec=null;flash('Распознаю…');
   try{const f=new FormData();f.append('file',new Blob(ch,{type:'audio/webm'}),'a.webm');f.append('model',cfg.stt);
    const r=await fetch(cfg.url.replace(/\/$/,'')+'/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+cfg.key},body:f}),j=await r.json();
    if(!j.text)throw Error(j.error?.message||'пустой результат');
    homeOut=j.text.trim();inv(fromKey?'paste_text':'set_clip',{text:homeOut});flash('Текст готов')}
   catch(e){flash('Голос: '+e.message)}render()};
  mr.start();rec={kind:'voice',mr,t0:Date.now()};flash('Говори, повтори сочетание для конца');render()}
 catch(e){flash('Микрофон: '+e.message)}}
async function screenRec(){
 if(rec?.kind==='screen')return rec.mr.stop();
 try{const st=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false}),ch=[],mr=new MediaRecorder(st);
  mr.ondataavailable=e=>ch.push(e.data);
  st.getVideoTracks()[0].onended=()=>{if(mr.state!=='inactive')mr.stop()};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());rec=null;const fr=new FileReader();
   fr.onload=async()=>{try{homeOut=await inv('save_bytes',{name:'rec-'+Date.now()+'.webm',data:fr.result.split(',')[1]});flash('Запись сохранена')}catch(e){flash('Запись: '+e)}render()};
   fr.readAsDataURL(new Blob(ch,{type:'video/webm'}))};
  mr.start(1000);rec={kind:'screen',mr,t0:Date.now()};render()}
 catch(e){flash('Запись: '+e.message)}}

const WI=c=>c===0?'sun':c<3?'cloudsun':c===3?'cloud':c<51?'fog':c<61?'rain':c<71?'rain':c<80?'snow':c<83?'rain':c<95?'snow':'storm';

// unit conversion for the command bar
const UN={'km>mi':x=>x*.621371,'mi>km':x=>x*1.609344,'kg>lb':x=>x*2.20462,'lb>kg':x=>x/2.20462,'c>f':x=>x*9/5+32,'f>c':x=>(x-32)*5/9,'m>ft':x=>x*3.28084,'ft>m':x=>x/3.28084};
const conv=s=>{const m=s.match(/^([\d.,]+)\s*([a-z]+)\s*(?:in|to|в|>)\s*([a-z]+)$/i);if(!m)return;const f=UN[m[2].toLowerCase()+'>'+m[3].toLowerCase()];return f?String(+f(+m[1].replace(',','.')).toFixed(3)):0};

// currency: «100 usd» or «100 usd to eur», rates from open.er-api.com (cached for 6 hours)
let rates=ls('rates',null);
async function getRates(){if(rates&&Date.now()-rates.t<216e5)return rates.r;
 try{const j=await(await fetch('https://open.er-api.com/v6/latest/USD')).json();if(j.rates){rates={t:Date.now(),r:j.rates};sv('rates',rates);return j.rates}}catch{}return rates?.r||null}
async function curConv(t){const m=t.match(/^([\d.,]+)\s*([a-zA-Z]{3})(?:\s*(?:in|to|в|>)\s*([a-zA-Z]{3}))?$/);if(!m)return;
 const r=await getRates();if(!r)return;const a=m[2].toUpperCase(),b=(m[3]||cfg.cur||'RUB').toUpperCase();
 if(!r[a]||!r[b]||a===b)return;return (+m[1].replace(',','.')*r[b]/r[a]).toLocaleString('ru',{maximumFractionDigits:2})+' '+b}

  catch(e){t.textContent='Не вышло: '+e.message+'. Проверь ключ и VPN.'}},
 shot:async()=>{try{homeOut=await inv('screenshot');flash('Скриншот в буфере и в Картинки\\ChaldIsland')}catch(e){flash('Скриншот: '+e)}render()},
 qr:async()=>{try{const r=await inv('scan_qr');if(!r.length){flash('QR-код не найден на экране');return}homeOut=r.join('\n');flash('QR найден');setOpen(true,'home')}catch(e){flash('QR: '+e)}},
 rec:()=>screenRec(),voice:()=>voice(false),
 color:async()=>{try{const c=(await new EyeDropper().open()).sRGBHex;homeOut=c;inv('set_clip',{text:c});flash('Цвет '+c+' в буфере');render()}catch{}},
 plain:async()=>{await inv('release_focus');inv('paste_plain')},
 hcopy:()=>{inv('set_clip',{text:homeOut});flash('Скопировано')},
 hopen:()=>inv('open_url',{url:homeOut}),
 wset:async()=>{const n=$('#wc').value.trim();if(!n)return;
  try{const r=(await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ru&name='+encodeURIComponent(n))).json()).results?.[0];
   if(!r)return flash('Город не найден');sv('city',{name:r.name,lat:r.latitude,lon:r.longitude});await loadWx()}catch(e){flash('Погода: '+e.message)}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-act]');if(!b)return;e.stopPropagation();
 if(b.dataset.tab){if(b.dataset.tab==='chat'&&tab!=='chat')chatView='list';tab=b.dataset.tab;if(KEYTABS.includes(tab))grab();enter();render()}else A[b.dataset.act]?.(b.dataset)},true);
document.addEventListener('pointerdown',e=>{if(e.target.matches('input:not([type=range]):not([type=checkbox]),textarea'))grab()});
// drag a file out of the shelf / downloads into any other window (native drag and drop)
let dg=null;
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.drag');dg=r&&!e.target.closest('i,button')?{p:r.dataset.path,x:e.clientX,y:e.clientY}:null},true);
document.addEventListener('pointermove',e=>{if(dg&&e.buttons&&Math.hypot(e.clientX-dg.x,e.clientY-dg.y)>6){const p=dg.p;dg=null;startDrag(p)}});
document.addEventListener('pointerup',()=>dg=null);
async function startDrag(p){dragging=true;
 try{await inv('plugin:drag|start_drag',{item:[p],image:await inv('drag_icon'),onEvent:new T.core.Channel()})}
 catch(e){flash('Перетаскивание: '+e)}
 dragging=false}
applyPlace();applyScale();inv('set_fs_hide',{on:cfg.fs!==false});if(cfg.obs)inv('set_capture_visible',{on:true});
if(cfg.autohide)setTimeout(()=>{if(!open&&!hov)setHidden(true)},3000);
render();
</script>
