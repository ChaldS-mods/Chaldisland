[package]
name = "chaldisland"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-drag = "2"
serde_json = "1"
winreg = "0.52"
windows = { version = "0.58", features = [
    "Foundation", "Foundation_Collections", "Devices_Radios", "Media_Control",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Power",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging" ] }
tauri-plugin-global-shortcut = "2"
arboard = { version = "3", features = ["image-data"] }
enigo = "0.2"
xcap = "0.9"
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
dirs = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
